<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            background: white;
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <form action="/register" method="POST">

        <input type="text"
               name="studentName"
               placeholder="Student Name"
               required>

        <input type="text"
               name="rollNumber"
               placeholder="Roll Number"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <select name="course" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
